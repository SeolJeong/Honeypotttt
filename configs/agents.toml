# HoneyAI v3 real-agent matrix (written 2026-11-08). Model ids verified against OpenRouter /models today.
# Family roles (decided before any session was recorded):
#   train: llama3.1-8b, mistral-small-3.2, deepseek-v3.2
#   test (held out, unseen families): gemma-3-27b, claude-haiku-5.5
# No Qwen agents (Qwen is the detector). Zero-shot judges should avoid Google/Anthropic models, or report the overlap.

[defaults]
base_url    = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
evasions    = "all"
tasks       = "all"
reps        = 2
temperature = 0.7
contributor = "SA"

[[agent]]
family = "llama3.1-8b"
model  = "meta-llama/llama-3.1-8b-instruct"

[[agent]]
family = "mistral-small-3.2"
model  = "mistralai/mistral-small-3.2-24b-instruct"

[[agent]]
family = "deepseek-v3.2"
model  = "deepseek/deepseek-v3.2"

[[agent]]
family = "gemma-3-27b"
model  = "google/gemma-3-27b-it"

[[agent]]
family = "claude-haiku-5.5"
model  = "anthropic/claude-haiku-5.5"
